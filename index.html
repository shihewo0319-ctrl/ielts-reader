<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
  <title>IELTS 学习台</title>
  <link rel="stylesheet" href="style.css?v=1.1.4">
</head>
<body>
  <header class="topbar">
    <h1>🏠 IELTS 学习台 <span class="version">v1.1.3</span></h1>
    <div class="topbar-actions">
      <div class="settings-wrap">
        <button class="settings-btn" id="settingsBtn" title="设置" aria-label="设置">⚙️</button>
        <div class="settings-menu" id="settingsMenu" hidden>
          <div class="settings-panel" id="settingsMain">
            <div class="settings-title">设置</div>
            <button class="settings-item" data-panel="ai">AI 设置 <span class="arrow">→</span></button>
            <div class="settings-more">更多子菜单即将上线…</div>
          </div>
          <div class="settings-panel" id="settingsAi" hidden>
            <div class="settings-title">
              <button class="settings-back" id="settingsBack" title="返回设置">←</button>
              AI 设置
            </div>
            <div class="settings-body">
              <div class="settings-section">API Key 绑定</div>
              <p class="settings-hint">点击「添加 API KEY」，选择服务商并填写密钥，仅保存在本机浏览器。</p>
              <div class="apikey-bound" id="apikeyBound"></div>
              <div class="apikey-empty" id="apikeyEmpty" hidden>尚未绑定任何 API Key</div>
              <button class="apikey-btn apikey-add" id="apikeyAdd" type="button">＋ 添加 API KEY</button>
              <div class="apikey-form" id="apikeyForm" hidden>
                <select class="apikey-select" id="apikeyProvider"></select>
                <div class="apikey-row">
                  <input type="password" class="apikey-input" id="apikeyInput" placeholder="填入 API Key">
                  <button class="apikey-btn apikey-toggle" id="apikeyToggle" type="button" title="显示/隐藏">👁</button>
                </div>
                <div class="apikey-row apikey-form-btns">
                  <button class="apikey-btn apikey-save" id="apikeySave" type="button">保存</button>
                  <button class="apikey-btn apikey-cancel" id="apikeyCancel" type="button">取消</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="home-hero">
      <h2>欢迎使用 IELTS 学习台</h2>
      <p>选择下面的功能开始学习</p>
    </section>

    <section class="home-grid">
      <a class="feature-card" href="reader.html">
        <div class="fc-icon">📖</div>
        <div class="fc-title">阅读学习助手</div>
        <div class="fc-desc">上传雅思阅读文章，点击任意单词即可查看英文释义、音标、中文释义和双语例句，还支持选中词组查询。</div>
        <div class="fc-enter">进入 →</div>
      </a>
    </section>
  </main>
<script>
  (function () {
    var btn = document.getElementById('settingsBtn');
    var menu = document.getElementById('settingsMenu');
    var main = document.getElementById('settingsMain');
    var ai = document.getElementById('settingsAi');
    var back = document.getElementById('settingsBack');

    function resetPanels() { main.hidden = false; ai.hidden = true; }

    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var opening = menu.hidden;
      menu.hidden = !opening;
      if (opening) resetPanels();
    });

    document.addEventListener('click', function (e) {
      if (!e.target.closest('.settings-wrap')) { menu.hidden = true; resetPanels(); }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { menu.hidden = true; resetPanels(); }
    });

    // ===== API Key 绑定（手动添加方式） =====
    var PROVIDERS = [
      { id: 'openai', name: 'OpenAI' },
      { id: 'openai-compatible', name: 'OpenAI 兼容格式' },
      { id: 'deepseek', name: 'DeepSeek' },
      { id: 'opencode', name: 'OpenCode' },
      { id: 'go', name: 'Go' }
    ];
    var STORE_KEY = 'ielts_api_keys';
    var MASK = '\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022';
    var editingProvider = null;

    function loadKeys() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch (e) { return {}; }
    }
    function storeKey(id, value) {
      var keys = loadKeys();
      var v = (value || '').trim();
      if (v && v !== MASK) { keys[id] = v; } else { delete keys[id]; }
      localStorage.setItem(STORE_KEY, JSON.stringify(keys));
    }
    function providerName(id) {
      for (var i = 0; i < PROVIDERS.length; i++) { if (PROVIDERS[i].id === id) return PROVIDERS[i].name; }
      return id;
    }
    function renderProviderSelect(keys, current) {
      var sel = document.getElementById('apikeyProvider');
      sel.innerHTML = '';
      PROVIDERS.forEach(function (p) {
        var opt = document.createElement('option');
        opt.value = p.id;
        var bound = !!keys[p.id];
        opt.textContent = p.name + (bound ? '（已绑定）' : '');
        if (bound && p.id !== current) opt.disabled = true;
        sel.appendChild(opt);
      });
      if (current) sel.value = current;
    }
    function openForm(id) {
      editingProvider = id || null;
      var keys = loadKeys();
      renderProviderSelect(keys, editingProvider);
      var input = document.getElementById('apikeyInput');
      input.value = id ? (keys[id] || '') : '';
      input.type = 'password';
      document.getElementById('apikeyForm').hidden = false;
      input.focus();
    }
    function renderApiKeys() {
      var keys = loadKeys();
      var bound = document.getElementById('apikeyBound');
      var empty = document.getElementById('apikeyEmpty');
      bound.innerHTML = '';
      var ids = Object.keys(keys);
      empty.hidden = ids.length > 0;
      ids.forEach(function (id) {
        var item = document.createElement('div');
        item.className = 'apikey-bound-item';
        var head = document.createElement('div');
        head.className = 'apikey-head';
        var name = document.createElement('span');
        name.className = 'apikey-name';
        name.textContent = providerName(id);
        var val = document.createElement('span');
        val.className = 'apikey-val';
        val.textContent = MASK;
        val.dataset.plain = keys[id] || '';
        var status = document.createElement('span');
        status.className = 'apikey-status bound';
        status.textContent = '已绑定';
        head.appendChild(name); head.appendChild(val); head.appendChild(status);

        var ops = document.createElement('div');
        ops.className = 'apikey-row apikey-ops';
        var show = document.createElement('button');
        show.type = 'button'; show.className = 'apikey-btn'; show.textContent = '👁';
        show.title = '显示/隐藏';
        var edit = document.createElement('button');
        edit.type = 'button'; edit.className = 'apikey-btn'; edit.textContent = '✏️';
        edit.title = '修改';
        var del = document.createElement('button');
        del.type = 'button'; del.className = 'apikey-btn apikey-del'; del.textContent = '🗑';
        del.title = '删除';
        ops.appendChild(show); ops.appendChild(edit); ops.appendChild(del);

        show.addEventListener('click', function () {
          var showing = val.textContent !== MASK;
          val.textContent = showing ? MASK : (val.dataset.plain || '');
          show.textContent = showing ? '👁' : '🙈';
        });
        edit.addEventListener('click', function () { openForm(id); });
        del.addEventListener('click', function () {
          storeKey(id, '');
          if (editingProvider === id) { editingProvider = null; document.getElementById('apikeyForm').hidden = true; }
          renderApiKeys();
        });

        item.appendChild(head); item.appendChild(ops);
        bound.appendChild(item);
      });
      renderProviderSelect(keys, editingProvider);
    }

    document.getElementById('apikeyAdd').addEventListener('click', function () {
      editingProvider = null;
      renderProviderSelect(loadKeys(), null);
      var input = document.getElementById('apikeyInput');
      input.value = '';
      input.type = 'password';
      document.getElementById('apikeyForm').hidden = false;
      input.focus();
    });
    document.getElementById('apikeyToggle').addEventListener('click', function () {
      var input = document.getElementById('apikeyInput');
      input.type = (input.type === 'text') ? 'password' : 'text';
    });
    document.getElementById('apikeySave').addEventListener('click', function () {
      var id = document.getElementById('apikeyProvider').value;
      var v = document.getElementById('apikeyInput').value.trim();
      if (!v) { document.getElementById('apikeyInput').focus(); return; }
      storeKey(id, v);
      editingProvider = null;
      document.getElementById('apikeyForm').hidden = true;
      renderApiKeys();
    });
    document.getElementById('apikeyCancel').addEventListener('click', function () {
      editingProvider = null;
      document.getElementById('apikeyForm').hidden = true;
      renderApiKeys();
    });

    back.addEventListener('click', function () { resetPanels(); });
    document.querySelector('[data-panel="ai"]').addEventListener('click', function () {
      main.hidden = true; ai.hidden = false;
      document.getElementById('apikeyForm').hidden = true;
      editingProvider = null;
      renderApiKeys();
    });
  })();
</script>
</body>
</html>
