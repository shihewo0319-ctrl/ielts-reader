<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
  <title>IELTS 学习台 · 单词查询</title>
  <link rel="stylesheet" href="/src/styles/theme.css">
  <link rel="stylesheet" href="/src/styles/dict.css">
</head>
<body>
  <header class="topbar">
    <h1><a class="topbar-home" href="index.html" title="返回主页">🏠 IELTS 学习台</a> <span class="version" id="app-version">v1.1.58</span></h1>
    <nav id="top-nav" class="topbar-nav"></nav>
    <div class="topbar-actions">
      <a class="btn" href="reader.html">📖 去阅读</a>
    </div>
  </header>

  <main>
    <section class="dict-search">
      <h2 class="dict-search-title">🔍 单词查询</h2>
      <form id="dict-form" class="dict-search-form" autocomplete="off">
        <input id="dict-input" class="dict-search-input" type="text"
               placeholder="输入英文单词，如 gardens，回车或点「查询」"
               spellcheck="false">
        <button type="submit" class="btn btn-primary">查询</button>
      </form>
    </section>
    <div id="dict-result" class="dict-result"></div>
  </main>

  <script type="module" src="/src/lib/nav.js"></script>
<script type="module" src="/src/dict.js"></script>
</body>
</html>
